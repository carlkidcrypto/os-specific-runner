version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Check for updates to GitHub Actions every weekday
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    # Agentic workflow lock files are auto-generated by gh aw compile.
    # Dependabot should not open PRs for those manifests.
    exclude-paths:
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/*.md"
      - ".github/agents/*.md"
      - ".github/aw/*.lock.json"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"
