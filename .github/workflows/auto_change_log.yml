name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to document
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_auto_changelog.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      tag: ${{ inputs.tag || '' }}
