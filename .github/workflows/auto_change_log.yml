name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to document
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for existing open changelog PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open_count=$(gh pr list --head automation/update-changelog --state open --json number --jq 'length')
          echo "open_count=${open_count}" >> "$GITHUB_OUTPUT"
          if [ "$open_count" -gt 0 ]; then
            echo "An open PR from automation/update-changelog already exists. Skipping."
          fi

      - name: Checkout repository
        if: steps.check_pr.outputs.open_count == '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-chglog v0.15.4
        if: steps.check_pr.outputs.open_count == '0'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://github.com/git-chglog/git-chglog/releases/download/v0.15.4/git-chglog_0.15.4_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" git-chglog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-chglog" --version

      - name: Generate and validate changelog
        id: generate
        if: steps.check_pr.outputs.open_count == '0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git-chglog --config .chglog/config.yml -o CHANGELOG.tmp

          python3 - <<'EOF'
          from pathlib import Path
          import sys

          text = Path("CHANGELOG.tmp").read_text(encoding="utf-8")
          if not text.strip():
              print("Error: CHANGELOG.tmp is empty.", file=sys.stderr)
              sys.exit(1)

          lines = text.splitlines()
          section_starts = [i for i, line in enumerate(lines) if line.startswith("## ")]
          if not section_starts:
              print("Error: No release section header ('## ') found in CHANGELOG.tmp.", file=sys.stderr)
              sys.exit(1)

          start = section_starts[0]
          end = section_starts[1] if len(section_starts) > 1 else len(lines)
          latest_section = lines[start:end]
          if not any(line.lstrip().startswith("- ") for line in latest_section):
              print("Error: Latest tag section in CHANGELOG.tmp has no commit entries.", file=sys.stderr)
              sys.exit(1)
          EOF

          if [ -f CHANGELOG.md ] && head -n 1 CHANGELOG.md | grep -q '^Last Updated:'; then
            tail -n +3 CHANGELOG.md > CHANGELOG.existing.tmp
          elif [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md CHANGELOG.existing.tmp
          else
            : > CHANGELOG.existing.tmp
          fi

          if diff -u CHANGELOG.existing.tmp CHANGELOG.tmp >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive changelog changes detected."
            rm -f CHANGELOG.tmp CHANGELOG.existing.tmp
            exit 0
          fi

          utc_now=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          {
            printf 'Last Updated: %s\n\n' "$utc_now"
            cat CHANGELOG.tmp
          } > CHANGELOG.md
          rm -f CHANGELOG.tmp CHANGELOG.existing.tmp

          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            current="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            current="$INPUT_TAG"
          else
            current=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")
          fi

          if [ "$current" = "HEAD" ]; then
            base=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          else
            base=$(git describe --tags --abbrev=0 "${current}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi

          git log --oneline "${base}..${current}" > /tmp/changelog-commits.txt || true
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "range=${base}...${current}" >> "$GITHUB_OUTPUT"

      - name: Commit and open pull request
        if: steps.check_pr.outputs.open_count == '0' && steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGELOG_RANGE: ${{ steps.generate.outputs.range }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B automation/update-changelog
          git add CHANGELOG.md
          git commit -m "chore(docs): update changelog"
          git push --force origin automation/update-changelog

          pr_body_file=$(mktemp)
          {
            echo "## Automated Changelog Update"
            echo ""
            echo "- **Trigger:** \`${EVENT_NAME}\`"
            echo "- **Range:** \`${CHANGELOG_RANGE}\`"
            echo ""
            echo "Timestamp-only changes are filtered out before opening this PR."
            echo ""
            echo "### Commits in Range"
            echo ""
            echo '```text'
            if [ -s /tmp/changelog-commits.txt ]; then
              cat /tmp/changelog-commits.txt
            else
              echo "(no commits in range)"
            fi
            echo '```'
          } > "$pr_body_file"

          gh pr create \
            --base main \
            --head automation/update-changelog \
            --title "[changelog] Update CHANGELOG.md" \
            --body-file "$pr_body_file"

          rm -f "$pr_body_file" /tmp/changelog-commits.txt
