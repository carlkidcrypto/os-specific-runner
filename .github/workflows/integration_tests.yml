name: integration_tests
permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    paths:
      - 'action.yml'
      - 'dist/index.js'
      - 'index.js'
      - 'lib.js'
      - '.github/workflows/integration_tests.yml'

  pull_request:
    branches: [ main, master ]
    paths:
      - 'action.yml'
      - 'dist/index.js'
      - 'index.js'
      - 'lib.js'
      - '.github/workflows/integration_tests.yml'

jobs:
  integration_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Check out source code...
        uses: actions/checkout@v7

      - name: Running first test...
        uses: ./
        with:
          macos: echo "Hi from macos"
          linux: |
            echo "Hi from linux"
            echo "Hi from linux second line"
          windows: echo "Hi from windows"

      - name: Running second test...
        uses: ./
        with:
          macos: echo "test2"
          linux: echo "test2"
          windows: echo "test2"
          windowsShell: cmd

      - name: Running third test...
        uses: ./
        with:
          working_directory: my_new_dir/dir_2/dir3/here_5
          macos: echo "test2"
          linux: echo "test2"
          windows: echo "test2"
          windowsShell: cmd

      - name: Running fourth test...
        uses: ./
        with:
          working_directory: my_new_dir_1/dir_1/dir1/here_1
          macos: echo "test2"
          macosShell: bash

      - name: Running fifth test...
        uses: ./
        with:
          working_directory: my_new_dir_1/dir_1/dir1/here_1
          macos: echo "test2"
          macosShell: zsh

      - name: Running test for Windows non-zero exit code detection (pwsh)...
        id: test_pwsh_failure
        continue-on-error: true
        uses: ./
        with:
          windows: cmd.exe /c "exit 1"
          windowsShell: pwsh

      - name: Verify pwsh failure was detected
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if ("${{ steps.test_pwsh_failure.outcome }}" -ne "failure") {
            throw "Expected action to fail on Windows with pwsh when command exits non-zero, but outcome was ${{ steps.test_pwsh_failure.outcome }}"
          }

      - name: Running test for Windows non-zero exit code detection (powershell)...
        id: test_powershell_failure
        continue-on-error: true
        uses: ./
        with:
          windows: cmd.exe /c "exit 42"
          windowsShell: powershell

      - name: Verify powershell failure was detected
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if ("${{ steps.test_powershell_failure.outcome }}" -ne "failure") {
            throw "Expected action to fail on Windows with powershell when command exits non-zero, but outcome was ${{ steps.test_powershell_failure.outcome }}"
          }
